name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: "install mingw"
        run: "sudo apt-get update && sudo apt-get install -y binutils-mingw-w64-i686 binutils-mingw-w64-x86-64 gcc-mingw-w64-i686 gcc-mingw-w64-x86-64"
      - name: "build + test"
        run: |
          mkdir -p /tmp/vdutest
          VDU_TMP=/tmp/vdutest make test
          make exe
      - name: "verify PE minimum OS version"
        run: "python3 tools/patchpe.py --verify 6.0 dist/vista-defender-update-386.exe dist/vista-defender-update-amd64.exe"
      - name: "hash"
        run: "cd dist && sha256sum vista-defender-update-386.exe vista-defender-update-amd64.exe > SHA256SUMS.txt"
      - name: "create release"
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "WDUV ${GITHUB_REF_NAME}" \
            --notes "Static C binaries for the built-in Windows Defender of Windows Vista (i386 + x64). PE minOS 6.00, no runtime dependencies. See README for usage and the definition-generation matrix." \
            --latest \
            dist/SHA256SUMS.txt \
            dist/vista-defender-update-386.exe \
            dist/vista-defender-update-amd64.exe
