name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: "build + run test suite"
        run: |
          mkdir -p /tmp/vdutest
          VDU_TMP=/tmp/vdutest make test

  build:
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        arch: ["386", "amd64"]
    steps:
      - uses: "actions/checkout@v4"
      - name: "install mingw"
        run: "sudo apt-get update && sudo apt-get install -y binutils-mingw-w64-i686 binutils-mingw-w64-x86-64 gcc-mingw-w64-i686 gcc-mingw-w64-x86-64"
      - name: "build ${{ matrix.arch }}"
        run: "make exe"
      - name: "verify PE minimum OS version (6.00 = Vista)"
        run: "python3 tools/patchpe.py --verify 6.0 dist/vista-defender-update-386.exe dist/vista-defender-update-amd64.exe"
      - uses: "actions/upload-artifact@v4"
        with:
          name: "vdu-${{ matrix.arch }}"
          path: "dist/vista-defender-update-${{ matrix.arch }}.exe"
